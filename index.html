<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Subway PC Runner</title>
    <style>
        body { margin: 0; background: #222; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; margin: 0 auto; background: #333; }
        #ui { position: absolute; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; }
        .controls { font-size: 12px; color: #aaa; }
    </style>
</head>
<body>

    <div id="ui">
        <div id="score">Score: 0</div>
        <div id="speedText">Speed: 1x</div>
        <div class="controls">Left/Right: Move | Up: Boost</div>
    </div>
    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Canvas size
    canvas.width = 400;
    canvas.height = window.innerHeight;

    // Game Constants
    const lanes = [100, 200, 300]; // 3 Lanes ke center points
    let currentLane = 1; // Start in middle lane (lanes[1])
    let score = 0;
    let gameSpeed = 7;
    let isGameOver = false;

    const player = {
        x: lanes[currentLane],
        y: canvas.height - 100,
        width: 40,
        height: 60,
        color: '#00FF00', // Player color
        targetX: lanes[currentLane]
    };

    const obstacles = [];

    // Controls
    window.addEventListener('keydown', (e) => {
        if (isGameOver) { location.reload(); return; }

        if (e.key === "ArrowLeft" && currentLane > 0) {
            currentLane--;
        } else if (e.key === "ArrowRight" && currentLane < 2) {
            currentLane++;
        } else if (e.key === "ArrowUp") {
            gameSpeed += 2; // Speed boost
        }
        player.targetX = lanes[currentLane];
    });

    function spawnObstacle() {
        const laneIndex = Math.floor(Math.random() * 3);
        obstacles.push({
            x: lanes[laneIndex] - 20,
            y: -100,
            width: 40,
            height: 40,
            color: '#FF0000'
        });
    }

    let spawnTimer = 0;

    function update() {
        if (isGameOver) return;

        // Smooth movement (Lane change)
        player.x += (player.targetX - player.x) * 0.2;

        // Obstacle movement
        spawnTimer++;
        if (spawnTimer > 40) {
            spawnObstacle();
            spawnTimer = 0;
        }

        obstacles.forEach((obs, index) => {
            obs.y += gameSpeed;

            // Collision check
            if (obs.y + obs.height > player.y && 
                obs.y < player.y + player.height &&
                Math.abs((obs.x + 20) - player.x) < 20) {
                isGameOver = true;
            }

            // Remove if off screen
            if (obs.y > canvas.height) {
                obstacles.splice(index, 1);
                score++;
                document.getElementById('score').innerText = "Score: " + score;
                document.getElementById('speedText').innerText = "Speed: " + (gameSpeed/7).toFixed(1) + "x";
                gameSpeed += 0.05; // Natural speed increase
            }
        });
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Lanes
        ctx.strokeStyle = "#555";
        ctx.setLineDash([20, 20]);
        ctx.beginPath();
        ctx.moveTo(150, 0); ctx.lineTo(150, canvas.height);
        ctx.moveTo(250, 0); ctx.lineTo(250, canvas.height);
        ctx.stroke();

        // Draw Player (with a simple shadow)
        ctx.fillStyle = "rgba(0,0,0,0.3)";
        ctx.fillRect(player.x - 20, player.y + 10, player.width, player.height);
        ctx.fillStyle = player.color;
        ctx.fillRect(player.x - 20, player.y, player.width, player.height);

        // Draw Obstacles
        obstacles.forEach(obs => {
            ctx.fillStyle = obs.color;
            ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
        });

        if (isGameOver) {
            ctx.fillStyle = "white";
            ctx.font = "30px Arial";
            ctx.fillText("GAME OVE
